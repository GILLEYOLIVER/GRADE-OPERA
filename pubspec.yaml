name: grade_opera
description: Aplicativo offline para cálculo inteligente de grade e consumo de tecido.
publish_to: "none"
version: 1.1.8+10

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  intl: ^0.19.0
  path_provider: ^2.1.5
  pdf: ^3.11.1
  printing: ^5.13.4
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_opera.jpg
